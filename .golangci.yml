version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gocritic
    - bodyclose
    - errorlint
  settings:
    staticcheck:
      checks:
        - all
        # Spelling out the embedded field (ts.Time.IsZero) reads better than
        # relying on promotion.
        - -QF1008
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    paths:
      # npm packages ship Go files of their own; they are not ours.
      - web/node_modules
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
