# The monitor, and optionally a long soak run against it.
#   cp .env.example .env            # then set HM_PASS; without it the password is "default"
#   docker compose up -d --build    # the monitor on :8081 (page) and :8082/udp (intake)
#   docker compose --profile soak up -d --build   # plus soak traffic, until stopped
services:
  hm:
    build:
      context: .
      target: hm
      args:
        VERSION: ${HM_VERSION:-}
        COMMIT: ${HM_COMMIT:-none}
    image: health-monitor-nj:local
    restart: unless-stopped
    environment:
      HM_PASS: ${HM_PASS:-}
      HM_OPEN: ${HM_OPEN:-}
      TZ: ${TZ:-}
    ports:
      - "${HM_HTTP_PORT:-8081}:8081/tcp"
      - "${HM_UDP_PORT:-8082}:8082/udp"
    volumes:
      - hm-data:/data

  soak:
    profiles: [soak]
    build:
      context: .
      target: soak
    image: health-monitor-nj-soak:local
    restart: unless-stopped
    depends_on:
      hm:
        condition: service_healthy
    environment:
      HM_PASS: ${HM_PASS:-}
    volumes:
      - ./${SOAK_CONFIG:-soak.yaml}:/etc/soak/run.yaml:ro
    command: ["-config", "/etc/soak/run.yaml", "-addr", "hm:8082", "-status", "http://hm:8081", "-report", "${SOAK_REPORT:-1m}"]

volumes:
  hm-data:
